spring.application.name=attend_backend

# ===== DATABASE =====
spring.datasource.url=jdbc:postgresql://localhost:2005/attendx_db
spring.datasource.username=postgres
spring.datasource.password=bicky

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== SERVER PORT =====
server.port=8080

# ===== JWT SECRET =====
jwt.secret=attendx_super_secret_key_2025_do_not_share
#jwt.expiration=86400000
jwt.expiration=2592000000

# ===== SCHEDULER =====
spring.task.scheduling.enabled=true

# For Render deployment
server.port=${PORT:8080}

# ===== EMAIL (Gmail SMTP) =====
spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp-mail.outlook.com